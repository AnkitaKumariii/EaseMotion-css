<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease NFT Card Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Inline styles for demo layout resets */
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0f;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 2rem;
    }
    .demo-header h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #00ffcc, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .demo-header p {
      color: #8892b0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <h1>Ease NFT Gallery</h1>
    <p>Hover over the cards for a 3D tilt and neon glow effect</p>
  </div>

  <div class="gallery-container">
    <!-- NFT Card 1 -->
    <div class="nft-card">
      <div class="nft-card-inner">
        <div class="nft-image nft-bg-1">
          <div class="nft-badge">Rare</div>
        </div>
        <div class="nft-details">
          <h3>Cosmic Wanderer #124</h3>
          <div class="nft-meta">
            <span class="nft-price">0.45 ETH</span>
            <span class="nft-time">Ending in 12h</span>
          </div>
        </div>
      </div>
    </div>

    <!-- NFT Card 2 -->
    <div class="nft-card">
      <div class="nft-card-inner">
        <div class="nft-image nft-bg-2">
          <div class="nft-badge legendary">Legendary</div>
        </div>
        <div class="nft-details">
          <h3>Neon CyberPunk #89</h3>
          <div class="nft-meta">
            <span class="nft-price">1.20 ETH</span>
            <span class="nft-time">Ending in 2h</span>
          </div>
        </div>
      </div>
    </div>

    <!-- NFT Card 3 -->
    <div class="nft-card">
      <div class="nft-card-inner">
        <div class="nft-image nft-bg-3">
          <div class="nft-badge">Epic</div>
        </div>
        <div class="nft-details">
          <h3>Galactic Kitty #902</h3>
          <div class="nft-meta">
            <span class="nft-price">0.85 ETH</span>
            <span class="nft-time">Ending in 5h</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
